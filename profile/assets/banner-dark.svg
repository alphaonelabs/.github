<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Alpha One Labs — open-source education for everyone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow)"/>

  <!-- orbit mark -->
  <g transform="translate(150 150)" fill="none" stroke-width="3">
    <circle r="62" stroke="url(#accent)" stroke-opacity="0.9"/>
    <ellipse rx="92" ry="34" stroke="#38BDF8" stroke-opacity="0.55" transform="rotate(-25)"/>
    <ellipse rx="92" ry="34" stroke="#F472B6" stroke-opacity="0.45" transform="rotate(35)"/>
    <text x="0" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" stroke="none">α1</text>
  </g>

  <text x="290" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Alpha One Labs</text>
  <rect x="292" y="156" width="420" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="292" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#CBD5E1">Open-source education for everyone</text>
  <text x="292" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8" letter-spacing="2">LEARN  ·  BUILD  ·  EXPERIMENT  ·  TEACH</text>
</svg>
